<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P5 Custom Slider — local copy</title>
<style>
@font-face {
  font-family: 'Luckiest Guy';
  font-style: normal;
  font-weight: 400;
  src: url('fonts/luckiestguy-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Luckiest Guy';
  font-style: normal;
  font-weight: 400;
  src: url('fonts/luckiestguy-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

body {
  background-color: #000000;
  font-family: 'Luckiest Guy', cursive;
}

.container {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translateX(-50%) translateY(-50%);
}

.switch {
  position: relative;
  left: 50%;
  top: 50%;
  transform: translateX(-50%) translateY(-50%);
  display: inline-block;
  width: 90px;
  height: 40px;
  outline: none;
}

.switch input { 
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  z-index: 100;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #000000;
  border: 3px solid #ffffff;
  -webkit-transition: .1s;
  transition: .1s;
}

.slider:before {
  content: "OFF";
  position: absolute;
  left: 45px;
  bottom: -9px;
  z-index: 100;
  color: #000000;
  font-size: 2.5em;
  text-shadow:
   -2px -2px 0 #ffffff,  
    2px -2px 0 #ffffff,
   -2px  2px 0 #ffffff,
    2px  2px 0 #ffffff;
  -webkit-transform: translateX(0px) rotate(-10deg);
          transform: translateX(0px) rotate(-10deg);
  -webkit-transition: .1s;
          transition: .1s;
}

.slider:after {
  content: "";
  position: absolute;
  top: -27px;
  left: 27px;
  width: 0;
  height: 0;
  border-top: 70px solid transparent;
  border-right: 37px solid #ffffff;
  border-bottom: 15px solid transparent;
  transform: rotate(90deg);
}

input:checked + .slider {
  border-color: #ff1ead;
  animation: shake .15s linear 0s 1;
}

input:checked + .slider:before {
  content: "ON";
  text-shadow:
   -2px -2px 0 #ff1ead,  
    2px -2px 0 #ff1ead,
   -2px  2px 0 #ff1ead,
    2px  2px 0 #ff1ead;
  -webkit-transform: translateX(-65px) rotate(10deg);
          transform: translateX(-65px) rotate(10deg);
}

input:checked + .slider:after {
  content: "";
  position: absolute;
  border: none;
  top: 1px;
  left: 0px;
  width: 60px;
  height: 30px;
  transform: rotate(10deg) skew(-20deg);
  background: #ff1ead;
  box-shadow: -6px 3px #ff1ead;
}

@keyframes shake {
  0%   { transform: translateX(0px) rotate(0deg); }
  33%  { transform: translateX(2.5px) rotate(5deg); }
  66%  { transform: translateX(-2.5px) rotate(-5deg); }
  100% { transform: translateX(0px) rotate(0deg); }
}
</style>
</head>
<body>
<div class="container">
  <label class="switch">
    <input type="checkbox"/>
    <span class="slider"/>
  </label>
</div>

</body>
</html>
