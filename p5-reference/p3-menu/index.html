<script>
document.addEventListener("keydown", function (event) {
    if (event.key === "Tab") {
        event.preventDefault();
    }
});


document.addEventListener("DOMContentLoaded", function () {
    let menuItems = document.querySelectorAll('.text span[id^="m_"]');
    let currentIndex = 0;
    menuItems[currentIndex].style.transform = 'scale(130%) rotate(-28deg) translate(28px, 10px)';
    menuItems[currentIndex].style.zIndex = '1';
    document.getElementById('t_skill').style.opacity = '1';
    document.getElementById('t_skillw').style.opacity = '1';
    document.getElementById('t_skillch').style.opacity = '1';
    document.getElementById('t_skillch1').style.opacity = '1';

    menuItems[currentIndex].focus();

    document.addEventListener("keydown", function (event) {
        switch (event.key) {
            case "ArrowDown":
                currentIndex = (currentIndex + 1) % menuItems.length;
                break;
            case "ArrowUp":
                currentIndex = (currentIndex - 1 + menuItems.length) % menuItems.length;
                break;
            case "Enter":
                console.log("Enter pressed for:", menuItems[currentIndex].textContent);
                break;
            default:
                return;
        }

        menuItems[currentIndex].focus();

        menuItems.forEach(item => {
            item.style.transform = '';
            item.style.zIndex = '';
            item.style.opacity = '';
        });

        document.querySelectorAll('[id^="t_"]').forEach(function (tElement) {
            tElement.style.opacity = '0';
        });

        switch (menuItems[currentIndex].id) {
            case "m_skill":
                menuItems[currentIndex].style.transform = 'scale(130%) rotate(-28deg) translate(28px, 10px)';
                menuItems[currentIndex].style.zIndex = '1';
                document.getElementById('t_skill').style.opacity = '1';
                document.getElementById('t_skillw').style.opacity = '1';
                document.getElementById('t_skillch').style.opacity = '1';
                document.getElementById('t_skillch1').style.opacity = '1';
                break;
            case "m_item":
                menuItems[currentIndex].style.transform = 'scale(130%) rotate(-14deg) translate(36px, 6px)';
                menuItems[currentIndex].style.zIndex = '1';
                document.getElementById('t_item').style.opacity = '1';

                break;
