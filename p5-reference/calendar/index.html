<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="theme-color" content="#050505">

<title>Persona 5 Calendar</title>


<style>

/* =========================================
   PERSONA 5 CALENDAR
   DESIGN
========================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #050505;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}


body {

    display: flex;

    align-items: center;
    justify-content: center;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(230,0,18,0.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(230,0,18,0.18),
            transparent 30%
        ),

        #050505;

}


/* =========================================
   MAIN CARD
========================================= */

.calendar {

    position: relative;

    width: 94vw;
    height: 90vh;

    max-width: 1200px;

    padding: 45px;

    overflow: hidden;

    background:

        linear-gradient(
            135deg,
            #050505 0%,
            #050505 55%,
            #e60012 55%,
            #e60012 64%,
            #050505 64%
        );

    border: 4px solid white;

    box-shadow:

        14px 14px 0 #e60012,

        0 0 60px
        rgba(230,0,18,0.35);

}


/* =========================================
   BACKGROUND SHAPES
========================================= */

.calendar::before {

    content: "";

    position: absolute;

    width: 80%;

    height: 30px;

    right: -15%;

    top: 130px;

    background: #e60012;

    transform: rotate(-7deg);

    animation:
        redBar 5s ease-in-out infinite;

}


.calendar::after {

    content: "";

    position: absolute;

    width: 60%;

    height: 18px;

    left: -15%;

    bottom: 90px;

    background: white;

    transform: rotate(-8deg);

    opacity: 0.8;

    animation:
        whiteBar 6s ease-in-out infinite;

}


@keyframes redBar {

    0% {
        transform: translateX(0) rotate(-7deg);
    }

    50% {
        transform: translateX(-30px) rotate(-7deg);
    }

    100% {
        transform: translateX(0) rotate(-7deg);
    }

}


@keyframes whiteBar {

    0% {
        transform: translateX(0) rotate(-8deg);
    }

    50% {
        transform: translateX(25px) rotate(-8deg);
    }

    100% {
        transform: translateX(0) rotate(-8deg);
    }

}


/* =========================================
   CONTENT
========================================= */

.content {

    position: relative;

    z-index: 5;

    width: 100%;
    height: 100%;

}


/* =========================================
   HEADER
========================================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

}


.small-title {

    font-size: 15px;

    font-weight: 900;

    letter-spacing: 6px;

}


.title {

    margin-top: 8px;

    font-size:
        clamp(55px, 9vw, 110px);

    font-weight: 1000;

    font-style: italic;

    line-height: 0.8;

    letter-spacing: -6px;

    transform: skew(-6deg);

}


.subtitle {

    margin-top: 20px;

    font-size: 14px;

    font-weight: 900;

    letter-spacing: 4px;

}


/* =========================================
   CURRENT DATE
========================================= */

.current {

    text-align: right;

}


#currentDate {

    font-size:
        clamp(24px, 4vw, 45px);

    font-weight: 1000;

    font-style: italic;

}


#clock {

    margin-top: 8px;

    font-size: 18px;

    font-weight: 700;

    letter-spacing: 3px;

    color: #ccc;

}


/* =========================================
   DAYS
========================================= */

.days {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 12px;

    margin-top: 75px;

}


/* =========================================
   DAY CARD
========================================= */

.day {

    position: relative;

    min-height: 230px;

    padding: 20px 15px;

    background: #101010;

    border: 2px solid white;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    transition:

        transform 0.35s ease,

        background 0.35s ease,

        box-shadow 0.35s ease;

}


/* diagonal red stripe */

.day::before {

    content: "";

    position: absolute;

    width: 150%;

    height: 25px;

    left: -20%;

    bottom: 48px;

    background: #e60012;

    transform: rotate(-8deg);

    opacity: 0.8;

}


/* number */

.number {

    position: relative;

    z-index: 2;

    font-size:
        clamp(45px, 7vw, 85px);

    font-weight: 1000;

    font-style: italic;

    line-height: 0.8;

}


/* weekday */

.weekday {

    position: relative;

    z-index: 2;

    font-size: 16px;

    font-weight: 900;

    letter-spacing: 2px;

}


/* month */

.month {

    position: relative;

    z-index: 2;

    font-size: 14px;

    font-weight: 900;

    letter-spacing: 2px;

}


/* label */

.label {

    position: relative;

    z-index: 2;

    font-size: 11px;

    font-weight: 1000;

    letter-spacing: 2px;

}


/* =========================================
   TODAY
========================================= */

.day.today {

    background: #e60012;

    transform:
        translateY(-20px)
        rotate(-1deg);

    box-shadow:

        10px 10px 0 white,

        0 0 25px
        rgba(230,0,18,0.5);

}


.day.today::before {

    background: #050505;

}


/* =========================================
   SWIPE ANIMATION
========================================= */

.days.shift-left {

    animation:
        shiftLeft 0.35s ease;

}


.days.shift-right {

    animation:
        shiftRight 0.35s ease;

}


@keyframes shiftLeft {

    0% {
        transform: translateX(0);
        opacity: 1;
    }

    50% {
        transform: translateX(-60px);
        opacity: 0;
    }

    100% {
        transform: translateX(0);
        opacity: 1;
    }

}


@keyframes shiftRight {

    0% {
        transform: translateX(0);
        opacity: 1;
    }

    50% {
        transform: translateX(60px);
        opacity: 0;
    }

    100% {
        transform: translateX(0);
        opacity: 1;
    }

}


/* =========================================
   FOOTER
========================================= */

.footer {

    position: absolute;

    bottom: 5px;

    left: 0;

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.swipeText {

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 3px;

    color: #aaa;

}


.todayBadge {

    padding: 10px 15px;

    background: white;

    color: black;

    font-size: 12px;

    font-weight: 1000;

    transform: skew(-12deg);

}


/* =========================================
   MOBILE / IPAD
========================================= */

@media(max-width: 800px) {

    .calendar {

        width: 96vw;

        height: 94vh;

        padding: 25px 15px;

        box-shadow:

            7px 7px 0 #e60012;

    }


    .header {

        flex-direction: column;

    }


    .small-title {

        font-size: 10px;

        letter-spacing: 3px;

    }


    .title {

        font-size: 52px;

        letter-spacing: -4px;

    }


    .subtitle {

        margin-top: 12px;

        font-size: 10px;

        letter-spacing: 2px;

    }


    .current {

        margin-top: 20px;

        text-align: left;

    }


    #currentDate {

        font-size: 22px;

    }


    #clock {

        font-size: 14px;

    }


    .days {

        gap: 5px;

        margin-top: 40px;

    }


    .day {

        min-height: 165px;

        padding: 12px 7px;

    }


    .day.today {

        transform:
            translateY(-8px)
            rotate(-1deg);

        box-shadow:

            5px 5px 0 white;

    }


    .weekday {

        font-size: 10px;

        letter-spacing: 1px;

    }


    .number {

        font-size: 45px;

    }


    .month {

        font-size: 9px;

        letter-spacing: 1px;

    }


    .label {

        font-size: 7px;

        letter-spacing: 1px;

    }


    .swipeText {

        font-size: 8px;

        letter-spacing: 1px;

    }


    .todayBadge {

        font-size: 8px;

        padding: 7px 9px;

    }

}


</style>

</head>


<body>


<div class="calendar">

    <div class="content">


        <!-- HEADER -->

        <div class="header">


            <div>

                <div class="small-title">

                    PHANTOM THIEVES

                </div>


                <div class="title">

                    PERSONA 5

                </div>


                <div class="subtitle">

                    DAILY CALENDAR

                </div>

            </div>


            <div class="current">


                <div id="currentDate">

                </div>


                <div id="clock">

                </div>


            </div>


        </div>


        <!-- DAYS -->

        <div
            class="days"
            id="days">

        </div>


        <!-- FOOTER -->

        <div class="footer">


            <div class="swipeText">

                SWIPE ← →

            </div>


            <div class="todayBadge">

                TODAY IS RED

            </div>


        </div>


    </div>

</div>



<script>


/* =========================================
   DATA
========================================= */


const weekdays = [

    "SO",
    "MO",
    "DI",
    "MI",
    "DO",
    "FR",
    "SA"

];


const months = [

    "JAN",
    "FEB",
    "MÄR",
    "APR",
    "MAI",
    "JUN",
    "JUL",
    "AUG",
    "SEP",
    "OKT",
    "NOV",
    "DEZ"

];


let shift = 0;


/* =========================================
   GET DATE
========================================= */


function getDate(offset) {


    const date =
        new Date();


    date.setHours(
        12,
        0,
        0,
        0
    );


    date.setDate(

        date.getDate()
        +
        offset

    );


    return date;

}


/* =========================================
   CREATE FIVE DAYS
========================================= */


function createCalendar() {


    const container =
        document.getElementById(
            "days"
        );


    container.innerHTML = "";


    for (
        let i = -2;
        i <= 2;
        i++
    ) {


        const date =
            getDate(
                i + shift
            );


        const day =
            document.createElement(
                "div"
            );


        day.className =
            "day";


        /*
           HEUTE
        */

        if (i === 0) {

            day.classList.add(
                "today"
            );

        }


        const weekday =
            weekdays[
                date.getDay()
            ];


        const number =
            date.getDate();


        const month =
            months[
                date.getMonth()
            ];


        let label;


        if (i === 0) {

            label = "HEUTE";

        }

        else if (i < 0) {

            label = "VERGANGEN";

        }

        else {

            label = "KOMMT";

        }


        day.innerHTML = `


            <div class="weekday">

                ${weekday}

            </div>


            <div class="number">

                ${number}

            </div>


            <div class="month">

                ${month}

            </div>


            <div class="label">

                ${label}

            </div>


        `;


        container.appendChild(
            day
        );


    }

}


/* =========================================
   CURRENT DATE
========================================= */


function updateDate() {


    const now =
        new Date();


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const month =
        months[
            now.getMonth()
        ];


    const year =
        now.getFullYear();


    document.getElementById(
        "currentDate"
    ).textContent =

        `${day} ${month} ${year}`;

}


/* =========================================
   CLOCK
========================================= */


function updateClock() {


    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "clock"
    ).textContent =

        `${hours}:${minutes}:${seconds}`;

}


/* =========================================
   SWIPE
========================================= */


let startX = null;


document.addEventListener(

    "touchstart",

    function(event) {


        startX =
            event
                .changedTouches[0]
                .clientX;


    },

    {
        passive: true
    }

);


document.addEventListener(

    "touchend",

    function(event) {


        if (
            startX === null
        ) {

            return;

        }


        const endX =
            event
                .changedTouches[0]
                .clientX;


        const distance =
            endX - startX;


        if (
            Math.abs(distance)
            > 60
        ) {


            const days =
                document.getElementById(
                    "days"
                );


            if (
                distance < 0
            ) {


                days.classList.add(
                    "shift-left"
                );


                shift++;


            }

            else {


                days.classList.add(
                    "shift-right"
                );


                shift--;

            }


            setTimeout(

                function() {


                    days.classList.remove(
                        "shift-left"
                    );


                    days.classList.remove(
                        "shift-right"
                    );


                    createCalendar();


                },

                300

            );


        }


        startX = null;


    },

    {
        passive: true
    }

);


/* =========================================
   START
========================================= */


createCalendar();

updateDate();

updateClock();


/* Uhr jede Sekunde aktualisieren */

setInterval(

    function() {

        updateClock();

    },

    1000

);


/* Datum regelmäßig prüfen */

setInterval(

    function() {

        updateDate();

        createCalendar();

    },

    60000

);


</script>


</body>

</html>
